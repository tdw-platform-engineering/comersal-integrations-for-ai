version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${ECR_REGISTRY}
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}

  build:
    commands:
      # Pedidos Lambda
      - echo "Building pedidos..."
      - docker build -t $ECR_REPO_PEDIDOS:$IMAGE_TAG -f lambdas/pedidos/Dockerfile .
      - docker tag $ECR_REPO_PEDIDOS:$IMAGE_TAG $ECR_REPO_PEDIDOS:latest

      # Facturas Lambda
      - echo "Building facturas..."
      - docker build -t $ECR_REPO_FACTURAS:$IMAGE_TAG -f lambdas/facturas/Dockerfile .
      - docker tag $ECR_REPO_FACTURAS:$IMAGE_TAG $ECR_REPO_FACTURAS:latest

      # Catalogos Lambda — disabled until Terraform infra is created (ECR repo, Lambda, IAM)
      # - echo "Building catalogos..."
      # - docker build -t $ECR_REPO_CATALOGOS:$IMAGE_TAG -f lambdas/catalogos/Dockerfile .
      # - docker tag $ECR_REPO_CATALOGOS:$IMAGE_TAG $ECR_REPO_CATALOGOS:latest

  post_build:
    commands:
      - echo "Pushing images..."
      - docker push $ECR_REPO_PEDIDOS:$IMAGE_TAG
      - docker push $ECR_REPO_PEDIDOS:latest
      - docker push $ECR_REPO_FACTURAS:$IMAGE_TAG
      - docker push $ECR_REPO_FACTURAS:latest
      # - docker push $ECR_REPO_CATALOGOS:$IMAGE_TAG
      # - docker push $ECR_REPO_CATALOGOS:latest

      # Update Lambda function code
      - |
        aws lambda update-function-code \
          --function-name $PEDIDOS_FUNCTION_NAME \
          --image-uri $ECR_REPO_PEDIDOS:$IMAGE_TAG
      - |
        aws lambda update-function-code \
          --function-name $FACTURAS_FUNCTION_NAME \
          --image-uri $ECR_REPO_FACTURAS:$IMAGE_TAG
      # - |
      #   aws lambda update-function-code \
      #     --function-name $CATALOGOS_FUNCTION_NAME \
      #     --image-uri $ECR_REPO_CATALOGOS:$IMAGE_TAG

      - echo "Deploy complete"
